<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;width:390px;height:844px;overflow:hidden;background:#1f5c4a;font-family:system-ui;color:#fbfaf7}
.top{display:flex;justify-content:space-between;align-items:center;padding:18px 20px}
.logo{font:700 26px Georgia;color:#c6a469}.cart{background:#fbfaf7;color:#14261f;border-radius:999px;padding:10px 16px;font:600 14px system-ui}
h1{font:800 50px/0.95 system-ui;letter-spacing:-.03em;margin:14px 20px 8px}
p{margin:0 20px 18px;font-size:16px;opacity:.85}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 20px}
.bar{border-radius:38px;height:210px;position:relative;box-shadow:inset 0 -10px 22px rgba(0,0,0,.12),0 18px 30px -18px rgba(0,0,0,.5)}
.b1{background:#e8a598}.b2{background:#b9a7e0;margin-top:40px}.b3{background:#f2c14e;margin-top:-40px}.b4{background:#fbfaf7}
.cinta{position:absolute;left:0;right:0;bottom:26px;background:#fbfaf7;color:#14261f;padding:10px 14px;font:600 13px system-ui}
.b4 .cinta{background:#14261f;color:#fbfaf7}
.cta{position:absolute;left:20px;right:20px;bottom:22px;background:#f2c14e;color:#14261f;border-radius:999px;padding:18px;text-align:center;font:700 17px system-ui}
</style></head><body>
<div class="top"><span class="logo">Yumi Mix</span><span class="cart">Sacola · 2</span></div>
<h1>Casa em ordem, com carinho.</h1><p>Organização e decoração em pronta entrega, embrulhadas com cuidado.</p>
<div class="bars"><div class="bar b1"><div class="cinta">Kit 3 ganchos · R$ 19,90</div></div><div class="bar b2"><div class="cinta">Saboneteira · R$ 27,90</div></div><div class="bar b3"><div class="cinta">Porta-copos · R$ 29,90</div></div><div class="bar b4"><div class="cinta">Letreiro Natal · R$ 39,90</div></div></div>
<div class="cta">Ver peças em pronta entrega</div></body></html>
